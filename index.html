<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis finanzas</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f6;--sf:#fff;--ink:#101a17;--mut:#6b7a75;--ln:#e3e8e5;--ac:#0f766e;--on:#fff;--in:#15803d;--out:#c2410c;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1412;--sf:#16201d;--ink:#e8f1ed;--mut:#8fa29b;--ln:#27352f;--ac:#2dd4bf;--on:#04201b;--in:#4ade80;--out:#fb923c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1412;--sf:#16201d;--ink:#e8f1ed;--mut:#8fa29b;--ln:#27352f;--ac:#2dd4bf;--on:#04201b;--in:#4ade80;--out:#fb923c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
.app{max-width:520px;margin:0 auto;padding:14px 16px 120px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input,select{background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:12px;width:100%;min-width:0}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mut)}
.top b{color:var(--ink);text-transform:capitalize;font-weight:600;min-width:120px;text-align:center;display:inline-block}
.top button{font-size:22px;padding:6px 12px;color:var(--mut)}
.cur{display:flex;gap:6px;margin-top:8px}
.cur button{flex:1;padding:9px 0;border-radius:99px;border:1px solid var(--ln);background:var(--sf);color:var(--mut);font-weight:600;font-size:14px}
.cur button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tot{padding:14px 0 4px}
.tot .n{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.k{color:var(--mut);font-size:14px}
.sum{display:flex;gap:20px;margin-top:4px}
.in{color:var(--in)}.out{color:var(--out)}
.accs{display:flex;gap:10px;overflow-x:auto;padding:14px 16px;margin:0 -16px;scrollbar-width:none}
.acc{flex:none;min-width:132px;text-align:left;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:12px 14px}
.acc.on{border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac)}
.acc b{display:block;font-size:17px;margin-top:2px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px;margin:4px 0 6px}
.card h3{margin:0 0 8px;font-size:15px;font-weight:600}
svg{display:block;width:100%}
svg text{fill:var(--mut);font:10px "Bricolage Grotesque",system-ui,sans-serif}
.leg{display:flex;gap:14px;font-size:13px;color:var(--mut);margin-top:4px}
.cb{margin-top:8px;font-size:14px}
.cb div{display:flex;justify-content:space-between}
.cb i{display:block;height:6px;border-radius:9px;background:var(--ac);margin:3px 0 6px}
.day{margin:18px 0 4px;color:var(--mut);font-size:14px;text-transform:capitalize}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 0;border-bottom:1px solid var(--ln)}
.row .g{flex:1;min-width:0}
.row .g div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row b{font-weight:600}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ac);color:var(--on);font-weight:600;border-radius:99px;padding:16px 32px;font-size:17px;box-shadow:0 6px 20px rgba(0,0,0,.22)}
.bd{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sh{background:var(--sf);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;padding:10px 4px;border-radius:10px;color:var(--mut);font-weight:600}
.seg button.on{background:var(--sf);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.amt{border:0;background:none;font-size:44px;font-weight:800;letter-spacing:-.03em;text-align:center;padding:6px 0}
.lb{font-size:13px;color:var(--mut);margin:12px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--ln);border-radius:99px;padding:8px 14px;background:var(--bg)}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--on);font-weight:600}
.go{width:100%;background:var(--ac);color:var(--on);font-weight:600;border-radius:14px;padding:15px;margin-top:16px;font-size:17px}
.ghost{color:var(--out);padding:12px;width:100%;margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
h2{font-size:18px;margin:0 0 12px}
.set{display:grid;gap:8px;margin-top:8px}
.set button{border:1px solid var(--ln);border-radius:12px;padding:12px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="sh"></div>
<script>
const K='finanzas-v1',CURS=['VES','USD','EUR','USDT'];
const EXP=['Alimentación','Transporte','Vivienda','Servicios','Salud','Ocio','Educación','Compras','Otros'];
const INC=['Salario','Freelance','Inversiones','Otros ingresos'];
const ICON={banco:'🏦',billetera:'👛',efectivo:'💵'};
const uid=()=>Math.random().toString(36).slice(2,9);
const DEF=()=>({accounts:[{id:uid(),name:'Efectivo Bs',kind:'efectivo',cur:'VES',ini:0},{id:uid(),name:'Efectivo USD',kind:'efectivo',cur:'USD',ini:0},{id:uid(),name:'Banco',kind:'banco',cur:'VES',ini:0},{id:uid(),name:'Billetera USDT',kind:'billetera',cur:'USDT',ini:0}],tx:[],cats:{gasto:[...EXP],ingreso:[...INC]}});
let S=null;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||DEF();
function fix(){S.cats=S.cats||{gasto:[...EXP],ingreso:[...INC]};S.accounts.forEach(a=>{if(!CURS.includes(a.cur)||(a.kind==='efectivo'&&!['VES','USD'].includes(a.cur)))a.cur='USD'})}
fix();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SYM={VES:'Bs. ',USD:'$ ',EUR:'€ '};
const money=(n,c)=>{const v=Math.abs(n||0).toLocaleString('es',{minimumFractionDigits:2,maximumFractionDigits:2});return(n<0?'−':'')+(c==='USDT'?v+' USDT':SYM[c]+v)};
const p2=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const shift=(m,n)=>{const[y,mo]=m.split('-').map(Number);const d=new Date(y,mo-1+n,1);return d.getFullYear()+'-'+p2(d.getMonth()+1)};
let M=today().slice(0,7),FA=null,SH=null,VC='VES';
const acc=id=>S.accounts.find(a=>a.id===id);
const an=id=>{const a=acc(id);return a?esc(a.name):'—'};
const cu=id=>(acc(id)||{}).cur;
const bal=a=>a.ini+S.tx.reduce((s,t)=>s+(t.acc===a.id?(t.type==='ingreso'?t.amt:-t.amt):0)+(t.type==='transfer'&&t.to===a.id?(t.amt2||t.amt):0),0);
const usedC=()=>CURS.filter(c=>S.accounts.some(a=>a.cur===c));
const mTx=()=>S.tx.filter(t=>t.date.slice(0,7)===M);
const vTx=()=>mTx().filter(t=>t.type!=='transfer'&&cu(t.acc)===VC);
const sum=(l,t)=>l.filter(x=>x.type===t).reduce((a,x)=>a+x.amt,0);
function dayLabel(d){const t=today();if(d===t)return'Hoy';const y=new Date();y.setDate(y.getDate()-1);if(d===y.getFullYear()+'-'+p2(y.getMonth()+1)+'-'+p2(y.getDate()))return'Ayer';return new Date(d+'T12:00').toLocaleDateString('es',{weekday:'long',day:'numeric',month:'short'})}

function chart(){
const tx=vTx();if(!tx.length)return'<div class="card"><h3>Cómo va el mes</h3><div class="k">Aún no hay movimientos en '+VC+' este mes.</div></div>';
const[y,mo]=M.split('-').map(Number),nd=new Date(y,mo,0).getDate(),now=today(),lim=now.slice(0,7)===M?+now.slice(8):(now.slice(0,7)<M?0:nd);
const ci=[],cg=[];let i=0,g=0;
for(let d=1;d<=lim;d++){const ds=M+'-'+p2(d);tx.filter(t=>t.date===ds).forEach(t=>t.type==='ingreso'?i+=t.amt:g+=t.amt);ci.push(i);cg.push(g)}
const mx=Math.max(1,i,g),X=k=>10+k/Math.max(1,nd-1)*320,Y=v=>100-v/mx*88;
const pl=(a,c)=>a.length?`<polyline points="${a.map((v,k)=>X(k)+','+Y(v)).join(' ')}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round"/><circle cx="${X(a.length-1)}" cy="${Y(a[a.length-1])}" r="3.5" fill="${c}"/>`:'';
const cats={};tx.filter(t=>t.type==='gasto').forEach(t=>cats[t.cat]=(cats[t.cat]||0)+t.amt);
const top=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,5),tm=top.length?top[0][1]:1;
return`<div class="card"><h3>Cómo va el mes</h3><svg viewBox="0 0 340 118" role="img" aria-label="Ingresos y gastos acumulados del mes"><line x1="10" y1="100" x2="330" y2="100" stroke="var(--ln)"/>${pl(ci,'var(--in)')}${pl(cg,'var(--out)')}<text x="10" y="114">1</text><text x="330" y="114" text-anchor="end">${nd}</text><text x="10" y="9">${money(mx,VC)}</text></svg>
<div class="leg"><span class="in">● Ingresos ${money(i,VC)}</span><span class="out">● Gastos ${money(g,VC)}</span></div>
<div class="k" style="margin-top:6px">Balance del mes: <b style="color:var(--ink)">${money(i-g,VC)}</b></div>
${top.length?`<div class="cb">${top.map(([c,v])=>`<div><span>${esc(c)}</span><span>${money(v,VC)}</span></div><i style="width:${v/tm*100}%"></i>`).join('')}</div>`:''}</div>`}

function draw(){
const uc=usedC();if(!uc.includes(VC))VC=uc[0]||'VES';
const accs=S.accounts.filter(a=>a.cur===VC);
if(FA&&!accs.some(a=>a.id===FA))FA=null;
const l=mTx().filter(t=>{const A=acc(t.acc),B=t.to&&acc(t.to);const inV=(A&&A.cur===VC)||(B&&B.cur===VC);return inV&&(!FA||t.acc===FA||t.to===FA)}).sort((a,b)=>b.date.localeCompare(a.date));
const v=vTx(),tot=accs.reduce((s,a)=>s+bal(a),0),days={};
l.forEach(t=>(days[t.date]=days[t.date]||[]).push(t));
document.getElementById('app').innerHTML=`
<div class="top"><button data-a="pm" aria-label="Mes anterior">‹</button><b>${new Date(M+'-01T12:00').toLocaleDateString('es',{month:'long',year:'numeric'})}</b><button data-a="nm" aria-label="Mes siguiente">›</button><button data-a="set" aria-label="Ajustes">⚙</button></div>
<div class="cur">${uc.map(c=>`<button class="${c===VC?'on':''}" data-a="vc" data-v="${c}">${c}</button>`).join('')}</div>
<div class="tot"><div class="k">Saldo total en ${VC}</div><div class="n">${money(tot,VC)}</div>
<div class="sum"><span class="in">+ ${money(sum(v,'ingreso'),VC)}</span><span class="out">− ${money(sum(v,'gasto'),VC)}</span></div></div>
<div class="accs">${accs.map(a=>`<button class="acc ${FA===a.id?'on':''}" data-a="fa" data-id="${a.id}"><span class="k">${ICON[a.kind]||'💳'} ${esc(a.name)}</span><b>${money(bal(a),VC)}</b></button>`).join('')}</div>
${chart()}
${l.length?Object.keys(days).map(d=>`<div class="day">${dayLabel(d)}</div>`+days[d].map(t=>{const tr=t.type==='transfer';
let sg,am,c;if(tr){const out=FA?FA===t.acc:cu(t.acc)===VC;sg=out?'−':'+';am=out?t.amt:(t.amt2||t.amt);c=out?cu(t.acc):cu(t.to)}else{sg=t.type==='ingreso'?'+':'−';am=t.amt;c=cu(t.acc)}
return`<button class="row" data-a="edit" data-id="${t.id}"><div class="g"><div><b>${tr?'Transferencia':esc(t.cat)}</b></div><div class="k">${tr?an(t.acc)+' → '+an(t.to):an(t.acc)}${t.note?' · '+esc(t.note):''}</div></div><b class="${tr?'':t.type==='ingreso'?'in':'out'}">${sg}${money(am,c)}</b></button>`}).join('')).join(''):`<div class="empty">${S.tx.length?'Sin movimientos en '+VC+' este mes.':'Toca “Registrar” para anotar tu primer movimiento.'}</div>`}
<button class="fab" data-a="new">+ Registrar</button>`}

function sync(){if(!SH)return;const g=i=>document.getElementById(i);if(g('amt'))SH.amt=g('amt').value;if(g('amt2'))SH.amt2=g('amt2').value;if(g('note'))SH.note=g('note').value;if(g('dt'))SH.date=g('dt').value||today();if(g('nc'))SH.nc=g('nc').value}
function drawSheet(focus){
const s=SH,A=S.accounts,diff=s.type==='transfer'&&s.to&&cu(s.acc)!==cu(s.to);
const chips=(sel,act)=>A.map(a=>`<button class="chip ${a.id===sel?'on':''}" data-a="${act}" data-id="${a.id}">${ICON[a.kind]||'💳'} ${esc(a.name)} · ${a.cur}</button>`).join('');
const cats=s.type==='gasto'?S.cats.gasto:S.cats.ingreso;
document.getElementById('sh').innerHTML=`<div class="bd" data-a="bd"><div class="sh" role="dialog" aria-label="Movimiento">
<div class="seg"><button class="${s.type==='gasto'?'on':''}" data-a="type" data-v="gasto">Gasto</button><button class="${s.type==='ingreso'?'on':''}" data-a="type" data-v="ingreso">Ingreso</button><button class="${s.type==='transfer'?'on':''}" data-a="type" data-v="transfer">Transferir</button></div>
<div class="k" style="text-align:center">${s.acc?'Monto en '+cu(s.acc):''}</div>
<input class="amt" id="amt" type="number" inputmode="decimal" min="0" placeholder="0" value="${s.amt}" aria-label="Monto">
${s.type!=='transfer'?`<div class="lb">Categoría</div><div class="chips">${cats.map(c=>`<button class="chip ${c===s.cat?'on':''}" data-a="cat" data-v="${esc(c)}">${esc(c)}</button>`).join('')}${s.addc?'':'<button class="chip" data-a="addc">+ Nueva</button>'}</div>
${s.addc?'<div class="two" style="margin-top:8px;grid-template-columns:1fr auto"><input id="nc" placeholder="Nombre de la categoría" value="'+esc(s.nc||'')+'"><button class="chip on" data-a="savec">Agregar</button></div>':''}`:''}
<div class="lb">${s.type==='ingreso'?'Entra a':'Sale de'}</div><div class="chips">${chips(s.acc,'from')}</div>
${s.type==='transfer'?`<div class="lb">Entra a</div><div class="chips">${chips(s.to,'to')}</div>${diff?`<div class="lb">Monto que recibe en ${cu(s.to)}</div><input id="amt2" type="number" inputmode="decimal" min="0" placeholder="0" value="${s.amt2||''}">`:''}`:''}
<div class="two" style="margin-top:14px"><input id="note" placeholder="Nota (opcional)" value="${esc(s.note)}"><input id="dt" type="date" value="${s.date}"></div>
<button class="go" data-a="save">${s.edit?'Guardar cambios':'Guardar'}</button>
${s.edit?'<button class="ghost" data-a="del">Eliminar</button>':''}</div></div>`;
if(focus)document.getElementById('amt').focus()}

function openSheet(id){const t=S.tx.find(x=>x.id===id);
const pref=S.accounts.filter(a=>a.cur===VC),a0=S.last&&acc(S.last)&&cu(S.last)===VC?S.last:(pref[0]||S.accounts[0]).id,a1=(S.accounts.find(a=>a.id!==a0)||{}).id;
SH=t?{...t,edit:id}:{type:'gasto',cat:S.cats.gasto[0],acc:a0,to:a1,date:today(),amt:'',amt2:'',note:''};
drawSheet(!t)}
const close=()=>{SH=null;document.getElementById('sh').innerHTML=''};
const curOpts=k=>(k==='efectivo'?['VES','USD']:CURS).map(c=>`<option>${c}</option>`).join('');

function drawSet(){
const cl=(t)=>S.cats[t].map(c=>`<button class="chip" data-a="delcat" data-t="${t}" data-v="${esc(c)}" aria-label="Eliminar ${esc(c)}">${esc(c)} ✕</button>`).join('');
document.getElementById('sh').innerHTML=`<div class="bd" data-a="bd"><div class="sh"><h2>Cuentas y billeteras</h2>
${S.accounts.map(a=>`<div class="row"><div class="g"><div><b>${ICON[a.kind]||'💳'} ${esc(a.name)} · ${a.cur}</b></div><div class="k">${money(bal(a),a.cur)}</div></div><button class="k" data-a="delacc" data-id="${a.id}" aria-label="Eliminar ${esc(a.name)}">Eliminar</button></div>`).join('')}
<div class="lb">Nueva cuenta</div><input id="an" placeholder="Nombre (Mercantil, Binance, Zelle…)"><div class="two" style="margin-top:10px"><select id="ak"><option value="banco">Banco</option><option value="billetera">Billetera</option><option value="efectivo">Efectivo</option></select><select id="ac">${curOpts('banco')}</select></div>
<input id="ai" type="number" inputmode="decimal" placeholder="Saldo inicial (opcional)" style="margin-top:10px"><button class="go" data-a="addacc" style="margin-top:10px">Agregar cuenta</button>
<h2 style="margin-top:24px">Categorías</h2><div class="lb">Gastos</div><div class="chips">${cl('gasto')}</div><div class="lb">Ingresos</div><div class="chips">${cl('ingreso')}</div>
<div class="two" style="margin-top:12px;grid-template-columns:1fr 110px"><input id="cn" placeholder="Nueva categoría"><select id="ct"><option value="gasto">Gasto</option><option value="ingreso">Ingreso</option></select></div><button class="go" data-a="addcat" style="margin-top:10px">Agregar categoría</button>
<div class="lb" style="margin-top:22px">Tus datos se guardan solo en este dispositivo</div>
<div class="set"><button data-a="expj">Exportar copia</button><button data-a="expc">Exportar a CSV</button><button data-a="impj">Importar copia</button></div>
<input type="file" id="file" accept="application/json" hidden>
<button class="ghost" data-a="reset">Borrar todo</button><button class="ghost" style="color:var(--mut)" data-a="close">Cerrar</button></div></div>`}

function dl(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;document.body.appendChild(a);a.click();a.remove()}
function addCat(t,n){n=(n||'').trim();if(!n)return false;if(!S.cats[t].includes(n))S.cats[t].push(n);save();return n}

document.addEventListener('click',e=>{
const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;
if(a==='bd'){if(e.target===b){close();draw()}return}
if(a==='pm'){M=shift(M,-1);draw()}
else if(a==='nm'){M=shift(M,1);draw()}
else if(a==='vc'){VC=b.dataset.v;FA=null;draw()}
else if(a==='fa'){FA=FA===id?null:id;draw()}
else if(a==='new')openSheet();
else if(a==='edit')openSheet(id);
else if(a==='set')drawSet();
else if(a==='close'){close();draw()}
else if(a==='type'){sync();SH.type=b.dataset.v;SH.addc=false;SH.cat=SH.type==='gasto'?S.cats.gasto[0]:SH.type==='ingreso'?S.cats.ingreso[0]:'';if(SH.type==='transfer'&&SH.to===SH.acc)SH.to=(S.accounts.find(x=>x.id!==SH.acc)||{}).id;drawSheet()}
else if(a==='cat'){sync();SH.cat=b.dataset.v;drawSheet()}
else if(a==='addc'){sync();SH.addc=true;drawSheet();document.getElementById('nc').focus()}
else if(a==='savec'){sync();const n=addCat(SH.type,SH.nc);if(n)SH.cat=n;SH.addc=false;SH.nc='';drawSheet()}
else if(a==='from'){sync();SH.acc=id;drawSheet()}
else if(a==='to'){sync();SH.to=id;drawSheet()}
else if(a==='save'){sync();const amt=+SH.amt;
if(!(amt>0)){document.getElementById('amt').focus();return}
const t={id:SH.edit||uid(),type:SH.type,amt,acc:SH.acc,date:SH.date||today(),note:(SH.note||'').trim()};
if(SH.type==='transfer'){if(!SH.to||SH.to===SH.acc){alert('Elige dos cuentas distintas.');return}
t.to=SH.to;if(cu(t.acc)!==cu(t.to)){t.amt2=+SH.amt2;if(!(t.amt2>0)){alert('Escribe el monto que recibe la cuenta de destino.');return}}}
else t.cat=SH.cat;
if(SH.edit){const i=S.tx.findIndex(x=>x.id===SH.edit);S.tx[i]=t}else S.tx.push(t);
S.last=SH.acc;M=t.date.slice(0,7);if(cu(t.acc)&&t.type!=='transfer')VC=cu(t.acc);save();close();draw()}
else if(a==='del'){if(confirm('¿Eliminar este movimiento?')){S.tx=S.tx.filter(x=>x.id!==SH.edit);save();close();draw()}}
else if(a==='addacc'){const n=document.getElementById('an').value.trim();if(!n)return;S.accounts.push({id:uid(),name:n,kind:document.getElementById('ak').value,cur:document.getElementById('ac').value,ini:+document.getElementById('ai').value||0});save();drawSet()}
else if(a==='delacc'){if(S.accounts.length<2){alert('Debes conservar al menos una cuenta.');return}if(confirm('Se eliminarán la cuenta y sus movimientos. ¿Continuar?')){S.tx=S.tx.filter(t=>t.acc!==id&&t.to!==id);S.accounts=S.accounts.filter(x=>x.id!==id);if(FA===id)FA=null;save();drawSet()}}
else if(a==='addcat'){if(addCat(document.getElementById('ct').value,document.getElementById('cn').value))drawSet()}
else if(a==='delcat'){S.cats[b.dataset.t]=S.cats[b.dataset.t].filter(c=>c!==b.dataset.v);save();drawSet()}
else if(a==='expj')dl('finanzas-copia.json',JSON.stringify(S,null,1),'application/json');
else if(a==='expc'){const r=[['Fecha','Tipo','Categoría','Monto','Moneda','Cuenta origen','Cuenta destino','Monto recibido','Nota']].concat([...S.tx].sort((x,y)=>x.date.localeCompare(y.date)).map(t=>[t.date,t.type,t.cat||'',t.amt,cu(t.acc)||'',(acc(t.acc)||{}).name||'',t.to?(acc(t.to)||{}).name||'':'',t.amt2||'',t.note||'']));dl('movimientos.csv','\ufeff'+r.map(x=>x.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}
else if(a==='impj')document.getElementById('file').click();
else if(a==='reset'){if(confirm('Se borrarán todos tus datos. ¿Seguro?')){S=DEF();save();close();draw()}}
});
document.addEventListener('change',e=>{const t=e.target;
if(t.id==='ak')document.getElementById('ac').innerHTML=curOpts(t.value);
else if(t.id==='file'){const f=t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.tx||!d.accounts)throw 0;S=d;fix();save();close();draw()}catch(x){alert('El archivo no es una copia válida.')}};r.readAsText(f)}});
draw();
</script>
